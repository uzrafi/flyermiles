server:
  port: 8085

spring:
  application:
    name: flight-activity-simulator
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.apicurio.registry.serde.avro.AvroKafkaSerializer
      acks: all
      batch-size: 65536
      properties:
        enable.idempotence: true
        linger.ms: 10
        compression.type: lz4
    properties:
      apicurio.registry.url: ${REGISTRY_URL:http://localhost:8080/apis/registry/v2}
      apicurio.registry.auto-register: true

simulator:
  member-service-url: ${MEMBER_SERVICE_URL:http://localhost:8081}
  # v2 of FlightCompleted adds the optional cabin field. false = behave like a v1 producer.
  include-cabin: ${INCLUDE_CABIN:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
