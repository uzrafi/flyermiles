server:
  port: 8084
  shutdown: graceful
  tomcat:
    threads:
      max: 400

spring:
  application:
    name: query-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${QUERY_DB_URL:jdbc:postgresql://localhost:5432/query}
    username: ${DB_USER:flyermiles}
    password: ${DB_PASSWORD:flyermiles}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 200ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    consumer:
      group-id: query-service
      auto-offset-reset: earliest
      max-poll-records: 1000
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.apicurio.registry.serde.avro.AvroKafkaDeserializer
    listener:
      concurrency: ${LISTENER_CONCURRENCY:2}
    properties:
      apicurio.registry.url: ${REGISTRY_URL:http://localhost:8080/apis/registry/v2}
      apicurio.registry.use-specific-avro-reader: true

query:
  cache:
    enabled: true
    ttl: PT30S

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 10ms,25ms,50ms,100ms,250ms,500ms
