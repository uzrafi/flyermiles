server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: ledger-service
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${LEDGER_DB_URL:jdbc:postgresql://localhost:5432/ledger}
    username: ${DB_USER:flyermiles}
    password: ${DB_PASSWORD:flyermiles}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9094}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.apicurio.registry.serde.avro.AvroKafkaSerializer
      acks: all
      properties:
        enable.idempotence: true
        linger.ms: 5
    consumer:
      group-id: ledger-service
      auto-offset-reset: earliest
      isolation-level: read_committed
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: io.apicurio.registry.serde.avro.AvroKafkaDeserializer
    listener:
      concurrency: ${LISTENER_CONCURRENCY:3}
    properties:
      apicurio.registry.url: ${REGISTRY_URL:http://localhost:8080/apis/registry/v2}
      apicurio.registry.auto-register: true
      apicurio.registry.use-specific-avro-reader: true

ledger:
  snapshot-every: 100
  relay-batch-size: 500
  max-append-attempts: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 25ms,50ms,100ms,250ms,500ms
