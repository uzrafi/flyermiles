# Kafka run by the Strimzi operator: 3 KRaft nodes, each both controller and broker.
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: dual-role
  labels:
    strimzi.io/cluster: flyermiles
spec:
  replicas: 3
  roles: [controller, broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 5Gi
        deleteClaim: true
        kraftMetadata: shared
  resources:
    requests: { memory: 1Gi, cpu: 200m }
    limits: { memory: 1536Mi }
  jvmOptions:
    -Xms: 512m
    -Xmx: 768m
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: flyermiles
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.0
    listeners:
      - name: scram
        port: 9092
        type: internal
        tls: false
        authentication:
          type: scram-sha-512
    authorization:
      type: simple
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: false
      group.initial.rebalance.delay.ms: 0
  entityOperator:
    topicOperator: {}
    userOperator: {}
  # Exposes kafka_consumergroup_lag etc. for Grafana and alerts.
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
