global:
  kafkaBootstrap: flyermiles-kafka-bootstrap:9092
  registryUrl: http://apicurio:8080/apis/registry/v2
  otel:
    enabled: true
    endpoint: http://otel-collector.monitoring:4317

image:
  repository: flyermiles/ledger-service
  tag: dev
  pullPolicy: IfNotPresent

replicas: 2
port: 8082
javaOpts: "-Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError"

# Name of the Strimzi KafkaUser whose SCRAM secret this service authenticates with.
kafkaUser: ledger-service

database:
  user: flyermiles
  password: flyermiles

# Non-secret settings, mounted as environment variables through a ConfigMap.
config:
  LEDGER_DB_URL: "jdbc:postgresql://postgres:5432/ledger"
  LISTENER_CONCURRENCY: "3"

resources:
  requests:
    cpu: 100m
    memory: 400Mi
  limits:
    memory: 512Mi

pdb:
  enabled: true
  maxUnavailable: 1

serviceMonitor:
  enabled: true

terminationGracePeriodSeconds: 45

autoscaling:
  enabled: false

networkPolicy:
  enabled: true
