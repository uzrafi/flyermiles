apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app.kubernetes.io/name: redis }
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: redis, app.kubernetes.io/part-of: flyermiles }
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          # A cache only: no persistence, evict least-recently-used keys when full.
          args: ["redis-server", "--maxmemory", {{ .Values.redis.maxMemory | quote }}, "--maxmemory-policy", "allkeys-lru", "--save", ""]
          ports:
            - containerPort: 6379
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: apicurio
spec:
  selector: { app.kubernetes.io/name: apicurio }
  ports:
    - name: http
      port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apicurio
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: apicurio }
  template:
    metadata:
      labels: { app.kubernetes.io/name: apicurio, app.kubernetes.io/part-of: flyermiles }
    spec:
      containers:
        - name: apicurio
          image: {{ .Values.apicurio.image }}
          env:
            - name: REGISTRY_RULES_GLOBAL_COMPATIBILITY
              value: {{ .Values.apicurio.compatibility | quote }}
            - name: JAVA_OPTS_APPEND
              value: "-Xmx384m"
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /health/ready, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: 8080 }
            periodSeconds: 10
          resources:
            {{- toYaml .Values.apicurio.resources | nindent 12 }}
