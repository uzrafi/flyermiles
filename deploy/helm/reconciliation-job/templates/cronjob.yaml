apiVersion: v1
kind: Secret
metadata:
  name: reconciliation-job-db
type: Opaque
stringData:
  DB_USER: {{ .Values.database.user | quote }}
  DB_PASSWORD: {{ .Values.database.password | quote }}
---
# Run on demand: kubectl -n flyermiles create job --from=cronjob/reconciliation recon-$(date +%s)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reconciliation
  labels:
    app.kubernetes.io/name: reconciliation-job
    app.kubernetes.io/part-of: flyermiles
spec:
  schedule: {{ .Values.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: reconciliation-job
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          containers:
            - name: reconcile
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              envFrom:
                - secretRef:
                    name: reconciliation-job-db
              env:
                - name: JAVA_TOOL_OPTIONS
                  value: "-Xmx512m"
                - name: KAFKA_BOOTSTRAP
                  value: {{ .Values.kafkaBootstrap | quote }}
                - name: KAFKA_SASL_JAAS_CONFIG
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.kafkaUser }}
                      key: sasl.jaas.config
                - name: LEDGER_DB_URL
                  value: {{ .Values.database.ledgerUrl | quote }}
                - name: QUERY_DB_URL
                  value: {{ .Values.database.queryUrl | quote }}
                - name: PUSHGATEWAY_URL
                  value: {{ .Values.pushgatewayUrl | quote }}
                - name: SETTLE_TIMEOUT
                  value: {{ .Values.settleTimeout | quote }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
