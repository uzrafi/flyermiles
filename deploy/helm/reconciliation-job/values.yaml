image:
  repository: flyermiles/reconciliation-job
  tag: dev
  pullPolicy: IfNotPresent

schedule: "0 3 * * *"
kafkaBootstrap: flyermiles-kafka-bootstrap.flyermiles.svc:9092
kafkaUser: reconciliation
pushgatewayUrl: http://pushgateway-prometheus-pushgateway.monitoring:9091
settleTimeout: PT3M

database:
  ledgerUrl: jdbc:postgresql://postgres:5432/ledger
  queryUrl: jdbc:postgresql://postgres:5432/query
  user: flyermiles
  password: flyermiles

resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    memory: 768Mi
