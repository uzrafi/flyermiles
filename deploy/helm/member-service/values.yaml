global:
  kafkaBootstrap: flyermiles-kafka-bootstrap.flyermiles.svc:9092
  registryUrl: http://apicurio:8080/apis/registry/v2
  otel:
    enabled: true
    endpoint: http://otel-collector.monitoring:4317

image:
  repository: flyermiles/member-service
  tag: dev
  pullPolicy: IfNotPresent

replicas: 1
port: 8081
javaOpts: "-Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError"

# Name of the Strimzi KafkaUser whose SCRAM secret this service authenticates with.
kafkaUser: member-service

database:
  user: flyermiles
  password: flyermiles

# Non-secret settings, mounted as environment variables through a ConfigMap.
config:
  MEMBER_DB_URL: "jdbc:postgresql://postgres:5432/members"

resources:
  requests:
    cpu: 100m
    memory: 400Mi
  limits:
    memory: 512Mi

pdb:
  enabled: true
  maxUnavailable: 1

serviceMonitor:
  enabled: true

terminationGracePeriodSeconds: 45

autoscaling:
  enabled: false
