name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Unit tests, TopologyTestDriver tests, and Testcontainers tests (Docker is available on the runner).
      - run: ./mvnw -B -ntp verify
      - name: Concurrent-redemption result
        if: always()
        run: grep -h "RESULT concurrent_redemptions" ledger-service/target/surefire-reports/*-output.txt || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"

  helm:
    name: Helm lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render every chart
        run: |
          for chart in deploy/helm/*/; do
            [ "$(basename "$chart")" = flyermiles-lib ] && continue
            helm dependency build "$chart"
            helm lint "$chart"
            helm template ci "$chart" > /dev/null
          done

  images:
    name: Image build
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [member-service, ledger-service, redemption-service, query-service, earning-engine, flight-activity-simulator, reconciliation-job]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: ./mvnw -B -ntp -DskipTests -pl ${{ matrix.module }} -am package
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: MODULE=${{ matrix.module }}
          tags: flyermiles/${{ matrix.module }}:${{ github.sha }}
          push: false
